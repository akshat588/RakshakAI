{% extends "layout/base.html" %}

{% block title %}Scan History{% endblock %}

{% block content %}

<section class="max-w-7xl mx-auto py-10">

    <div class="flex items-center justify-between mb-8">

        <h1 class="text-4xl font-bold text-white">

            Scan History

        </h1>

    </div>

    <div class="bg-slate-900 border border-slate-700 rounded-3xl overflow-hidden">

        <table class="w-full">

            <thead class="bg-slate-800">

                <tr>

                    <th class="text-left p-4 text-slate-300">Engine</th>

                    <th class="text-left p-4 text-slate-300">Prediction</th>

                    <th class="text-left p-4 text-slate-300">Risk</th>

                    <th class="text-left p-4 text-slate-300">Confidence</th>

                    <th class="text-left p-4 text-slate-300">Scan ID</th>

                    <th class="text-left p-4 text-slate-300">Time</th>

                </tr>

            </thead>

            <tbody id="historyTable">

            </tbody>

        </table>

    </div>

</section>

<script>

async function loadHistory(){

    const response = await fetch("/api/history");

    const data = await response.json();

    const table = document.getElementById("historyTable");

    table.innerHTML = "";

    data.history
    .reverse()
    .forEach(scan=>{

    const prediction =
        scan.result ||
        scan.prediction ||
        "-";

    const confidence =
        scan.confidence==null
            ? "-"
            : scan.confidence + "%";

    const riskBadge =
        scan.risk==="HIGH"
            ? "text-danger"
            : scan.risk==="MEDIUM"
                ? "text-warning"
                : "text-success";

    table.innerHTML += `

<tr class="border-t border-white/5 hover:bg-white/5 transition">

<td class="p-4 font-semibold">

${scan.engine}

</td>

<td class="p-4">

${prediction}

</td>

<td class="p-4">

<span class="${riskBadge} font-bold">

${scan.risk}

</span>

</td>

<td class="p-4 text-primary">

${confidence}

</td>

<td class="p-4 font-mono text-sm">

${scan.scan_id}

</td>

<td class="p-4 text-muted">

${scan.saved_at || scan.timestamp || "-"}

</td>

</tr>

`;

});

}

loadHistory();

</script>

{% endblock %}
