<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        RakshakAI | AI-Powered Cyber Threat Intelligence Platform
        {% endblock %}
    </title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',

            theme: {
                extend: {

                    colors: {

                        background: "#050816",

                        surface: "#0F172A",

                        primary: "#00E5FF",

                        secondary: "#2563EB",

                        success: "#10B981",

                        warning: "#F59E0B",

                        danger: "#EF4444",

                        muted: "#94A3B8"

                    },

                    borderRadius: {

                        xl: "18px",
                        "2xl": "24px"

                    },

                    boxShadow: {

                        glow: "0 0 25px rgba(0,229,255,.18)",

                        glass: "0 8px 40px rgba(0,0,0,.45)"

                    },

                    fontFamily: {

                        sans: ['Inter', 'sans-serif'],

                        mono: ['JetBrains Mono', 'monospace']

                    }

                }
            }
        }
    </script>

    <!-- Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
          rel="stylesheet">

    <!-- Chart.js -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Lucide Icons -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Theme -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/theme.css') }}">

    {% block extra_css %}{% endblock %}

</head>

<body class="bg-background text-white font-sans antialiased">

    <!-- Background Effects -->

    <div class="fixed inset-0 overflow-hidden -z-50">

        <div class="absolute -top-40 left-20 w-96 h-96 rounded-full bg-primary/10 blur-[150px]"></div>

        <div class="absolute bottom-0 right-0 w-[500px] h-[500px] rounded-full bg-secondary/10 blur-[170px]"></div>

    </div>

    <!-- Loader -->

    <div id="loader"
         class="fixed inset-0 bg-background flex items-center justify-center z-[9999]">

        <div class="flex flex-col items-center gap-5">

            <div class="w-16 h-16 rounded-full border-4 border-primary border-t-transparent animate-spin"></div>

            <p class="text-primary font-mono tracking-widest">

                INITIALIZING RAKSHAKAI

            </p>

        </div>

    </div>

    <!-- App -->

    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar -->

        {% include 'components/sidebar.html' %}

        <!-- Content -->

        <div class="flex flex-col flex-1 overflow-hidden">

            {% include 'components/topbar.html' %}

            <main
                class="flex-1 overflow-y-auto px-8 py-6 bg-background">

                {% block content %}

                {% endblock %}

            </main>

        </div>

    </div>

    <!-- Toast -->

    <div id="toast-container"
         class="fixed top-5 right-5 z-50 space-y-3"></div>

    <script>

        window.addEventListener("load", () => {

            setTimeout(() => {

                document.getElementById("loader").style.display = "none";

            },700);

        });

        lucide.createIcons();

    </script>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    {% block extra_js %}

    {% endblock %}

</body>

</html>
