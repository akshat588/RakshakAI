<header
class="sticky top-0 z-40 h-20 bg-slate-950/80 backdrop-blur-xl border-b border-white/10 flex items-center justify-between px-8">

    <!-- ===================================== -->
    <!-- Left -->
    <!-- ===================================== -->

    <div class="flex items-center gap-6">

        <button
            id="menu-btn"
            class="lg:hidden w-11 h-11 rounded-xl hover:bg-white/10 transition">

            <i data-lucide="menu"></i>

        </button>

        <div>

            <h1 class="text-2xl font-bold tracking-wide">

                Security Operations Center

            </h1>

            <p class="text-sm text-slate-400 mt-1">

                AI Powered Cyber Threat Intelligence Platform

            </p>

        </div>

    </div>

    <!-- ===================================== -->
    <!-- Center -->
    <!-- ===================================== -->

    <div class="hidden xl:flex flex-1 justify-center px-12">

        <div class="relative w-full max-w-2xl">

            <i
                data-lucide="search"
                class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>

            <input
                type="text"
                placeholder="Search investigations, IOC, URLs, emails, UPI IDs..."
                class="w-full h-14 rounded-2xl bg-slate-900 border border-white/10 pl-14 pr-5 text-white placeholder:text-slate-500 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 outline-none transition">

        </div>

    </div>

    <!-- ===================================== -->
    <!-- Right -->
    <!-- ===================================== -->

    <div class="flex items-center gap-4">

        <!-- Threat Status -->

        <div
            class="hidden lg:flex items-center gap-3 rounded-2xl border border-red-500/20 bg-red-500/10 px-5 py-3">

            <div class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></div>

            <div>

                <p class="text-xs text-slate-400">

                    Current Threat

                </p>

                <h3
                    id="currentThreatHeader"
                    class="font-bold text-red-400">

                    HIGH

                </h3>

            </div>

        </div>

        <!-- AI Status -->

        <div
            class="hidden md:flex items-center gap-3 rounded-2xl border border-green-500/20 bg-green-500/10 px-5 py-3">

            <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>

            <div>

                <p class="text-xs text-slate-400">

                    AI Status

                </p>

                <h3 class="font-bold text-green-400">

                    9 Engines Online

                </h3>

            </div>

        </div>

        <!-- Notifications -->

        <button
            onclick="showNotifications()"
            class="relative w-12 h-12 rounded-2xl bg-slate-900 border border-white/10 hover:border-cyan-400 transition">

            <i data-lucide="bell"></i>

            <span
                class="absolute top-2 right-2 w-2 h-2 rounded-full bg-red-500"></span>

        </button>

        <!-- Settings -->

        <button
            onclick="showSettings()"
            class="w-12 h-12 rounded-2xl bg-slate-900 border border-white/10 hover:border-cyan-400 transition">

            <i data-lucide="settings-2"></i>

        </button>

        <!-- User -->

        <button
            onclick="showAdmin()"
            class="flex items-center gap-3 rounded-2xl bg-slate-900 border border-white/10 px-4 py-2 hover:border-cyan-400 transition">

            <div
                class="w-11 h-11 rounded-full bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center">

                <i data-lucide="shield-check"></i>

            </div>

            <div class="hidden md:block text-left">

                <h3 class="font-semibold">

                    Administrator

                </h3>

                <p class="text-xs text-slate-400">

                    Secure Session Active

                </p>

            </div>

        </button>

    </div>

</header>
