<header class="glass h-16 border-b border-white/10 px-8 flex items-center justify-between">

    <!-- Left -->

    <div class="flex items-center gap-6">

        <button id="menu-btn"
                class="lg:hidden p-2 rounded-xl hover:bg-white/10 transition">

            <i data-lucide="menu"></i>

        </button>

        <div>

            <h2 class="text-xl font-bold">

                Security Dashboard

            </h2>

            <p class="text-xs text-muted">

                AI-Powered Cyber Threat Intelligence Platform

            </p>

        </div>

    </div>

    <!-- Center -->

    <div class="hidden xl:flex items-center">

        <div class="relative w-[420px]">

            <i data-lucide="search"
               class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-muted"></i>

            <input
                type="text"
                placeholder="Search scans, reports or threats..."
                class="w-full bg-surface border border-white/10 rounded-2xl pl-12 pr-5 py-3 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition">

        </div>

    </div>

    <!-- Right -->

    <div class="flex items-center gap-4">

        <!-- AI Status -->

        <div class="hidden md:flex items-center gap-3 glass rounded-2xl px-4 py-2">

            <span class="w-3 h-3 rounded-full bg-success animate-pulse"></span>

            <span class="text-sm">

                AI Engines Online

            </span>

        </div>

        <!-- Notifications -->

        <button
            class="relative w-12 h-12 rounded-2xl glass hover:border-primary border border-transparent transition">

            <i data-lucide="bell"></i>

            <span
                class="absolute top-2 right-2 w-2.5 h-2.5 rounded-full bg-danger"></span>

        </button>

        <!-- Settings -->

        <button
            class="w-12 h-12 rounded-2xl glass hover:border-primary border border-transparent transition">

            <i data-lucide="settings-2"></i>

        </button>

        <!-- User -->

        <div
            class="glass rounded-2xl px-4 py-2 flex items-center gap-3 border border-white/10">

            <div
                class="w-11 h-11 rounded-full bg-primary/20 flex items-center justify-center">

                <i data-lucide="user"></i>

            </div>

            <div class="hidden md:block">

                <p class="font-semibold">

                    Administrator

                </p>

                <p class="text-xs text-muted">

                    Secure Session

                </p>

            </div>

        </div>

    </div>

</header>
